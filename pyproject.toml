[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "research-engine"
version = "0.7.0"
description = "Company-agnostic institutional equity research engine"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.5", "pyyaml>=6", "matplotlib>=3.8", "pyarrow>=14"]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov>=5", "httpx>=0.27", "ruff>=0.6", "mypy>=1.11", "types-PyYAML>=6"]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]

[project.scripts]
research-engine = "research_engine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"research_engine.api" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-markers"

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "UP", "SIM", "RET"]
ignore = [
    "E501",    # long lines are checked by line-length, and tables in comments exceed it legibly
    "B008",    # FastAPI depends on callables in argument defaults
    "SIM108",  # a ternary is not always clearer than an if/else
    "RET504",  # a named return value often documents what is being returned
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]           # bare asserts are the point of a test suite

[tool.ruff.lint.isort]
known-first-party = ["research_engine"]

[tool.mypy]
# `python_version` is deliberately not pinned. Setting it makes mypy parse *dependency stubs*
# as that version too, and modern stubs (numpy's, for one) use syntax newer than our floor —
# which aborts the whole run with a fatal error rather than a type error. The 3.10 floor is
# enforced where it belongs instead: ruff's target-version for syntax, and CI running the test
# suite on 3.10.
files = ["src/research_engine"]
ignore_missing_imports = true
# Strict optional is the remaining gap: roughly fifty Optional-narrowing errors live in code
# that guards at runtime in ways mypy cannot see. Turning it on is worthwhile work, but it is a
# refactor of working, tested code, so it is tracked rather than silently disabled.
strict_optional = false
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true

# Third-party stubs are not ours to type-check, and their syntax should never be able to fail
# our run. We check how we *use* these libraries, not how they are written.
[[tool.mypy.overrides]]
module = ["numpy.*", "matplotlib.*", "pyarrow.*"]
follow_imports = "skip"
follow_imports_for_stubs = true

[tool.coverage.run]
source = ["research_engine"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "raise NotImplementedError", "if TYPE_CHECKING:"]
