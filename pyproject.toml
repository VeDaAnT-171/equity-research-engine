[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "research-engine"
version = "0.7.0"
description = "Company-agnostic institutional equity research engine"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.5", "pyyaml>=6", "matplotlib>=3.8", "pyarrow>=14"]

[project.optional-dependencies]
dev = ["pytest>=7", "httpx>=0.27"]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]

[project.scripts]
research-engine = "research_engine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"research_engine.api" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
