name: industrials
display_name: Industrial manufacturers
extends: generic

classification:
  sic_ranges: [[3400, 3599], [3700, 3799]]
  keywords: [backlog, orders, manufacturing, aftermarket]

metrics:
  - id: depreciation_and_amortization
    name: Depreciation and amortization
    unit_kind: currency
    statement: cash_flow
    period_type: duration
    expected_sign: non_negative
    xbrl_concepts: [us-gaap:DepreciationDepletionAndAmortization]
  - id: ebitda
    name: EBITDA
    unit_kind: currency
    statement: income_statement
    period_type: duration
    derivation: operating_income + depreciation_and_amortization
  - id: inventory
    name: Inventory
    unit_kind: currency
    statement: balance_sheet
    period_type: instant
    expected_sign: non_negative
    xbrl_concepts: [us-gaap:InventoryNet]
  - id: backlog
    name: Backlog
    unit_kind: currency
    statement: operating
    period_type: instant
    expected_sign: non_negative
    extraction_hint: MD&A or earnings release; confirm whether backlog is funded or total.

analytics:
  - {id: ebitda_margin, name: EBITDA margin, category: profitability, kind: ratio, unit_kind: ratio, numerator: ebitda, denominator: revenue}
  - {id: backlog_conversion, name: Revenue / opening backlog, category: operating, kind: ratio, unit_kind: ratio, numerator: revenue, denominator: backlog, denominator_basis: opening}
  - {id: backlog_coverage, name: Backlog / revenue, category: operating, kind: ratio, unit_kind: multiple, numerator: backlog, denominator: revenue}
  - {id: net_debt_to_ebitda, name: Net debt / EBITDA, category: leverage, kind: ratio, unit_kind: multiple, numerator: total_debt - cash_and_equivalents, denominator: ebitda}
  - {id: capex_to_depreciation, name: Capex / D&A, category: capital_intensity, kind: ratio, unit_kind: multiple, numerator: capital_expenditure, denominator: depreciation_and_amortization}
  - {id: inventory_turnover, name: Inventory turnover, category: efficiency, kind: ratio, unit_kind: multiple, numerator: cost_of_revenue, denominator: inventory, denominator_basis: average}

charts:
  - {id: industrial_margins, title: Margins, kind: line, series: [gross_margin, ebitda_margin, operating_margin], format: percent}
  - {id: backlog, title: Backlog, kind: bar, series: [backlog], format: currency}

drivers:
  - id: revenue_trajectory
    name: Backlog conversion
    description: Opening backlog times the conversion rate observed historically.
    affects: [revenue]
    formula: backlog * backlog_conversion
  - id: operating_leverage
    name: Operating margin
    affects: [operating_income]
    formula: revenue * operating_margin

forecast_targets: [ebitda, depreciation_and_amortization, inventory]

valuation:
  preferred: [dcf_fcff, ev_ebitda, pe]
