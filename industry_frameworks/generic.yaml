# Root framework. Every other framework extends this directly or indirectly.
# xbrl_concepts are ORDERED CANDIDATES. Whether a filer actually uses them is verified at
# extraction time and reported in the data-quality output; it is never assumed.
name: generic
display_name: Generic operating company
description: Fallback for companies without a more specific framework.

metrics:
  - id: revenue
    name: Revenue
    unit_kind: currency
    statement: income_statement
    period_type: duration
    expected_sign: non_negative
    xbrl_concepts: [us-gaap:Revenues, us-gaap:RevenueFromContractWithCustomerExcludingAssessedTax, ifrs-full:Revenue]
  - id: cost_of_revenue
    name: Cost of revenue
    unit_kind: currency
    statement: income_statement
    period_type: duration
    expected_sign: non_negative
    xbrl_concepts: [us-gaap:CostOfRevenue, us-gaap:CostOfGoodsAndServicesSold, ifrs-full:CostOfSales]
  - id: gross_profit
    name: Gross profit
    unit_kind: currency
    statement: income_statement
    period_type: duration
    xbrl_concepts: [us-gaap:GrossProfit, ifrs-full:GrossProfit]
    derivation: revenue - cost_of_revenue
  - id: operating_income
    name: Operating income
    unit_kind: currency
    statement: income_statement
    period_type: duration
    xbrl_concepts: [us-gaap:OperatingIncomeLoss, ifrs-full:ProfitLossFromOperatingActivities]
  - id: pre_tax_income
    name: Pre-tax income
    unit_kind: currency
    statement: income_statement
    period_type: duration
    xbrl_concepts: [us-gaap:IncomeLossFromContinuingOperationsBeforeIncomeTaxesExtraordinaryItemsNoncontrollingInterest, ifrs-full:ProfitLossBeforeTax]
  - id: income_tax_expense
    name: Income tax expense
    unit_kind: currency
    statement: income_statement
    period_type: duration
    xbrl_concepts: [us-gaap:IncomeTaxExpenseBenefit, ifrs-full:IncomeTaxExpenseContinuingOperations]
  - id: net_income
    name: Net income
    description: IFRS ProfitLoss includes non-controlling interests; attribution is checked at extraction.
    unit_kind: currency
    statement: income_statement
    period_type: duration
    xbrl_concepts: [us-gaap:NetIncomeLoss, ifrs-full:ProfitLoss]
    derivation: pre_tax_income - income_tax_expense
  - id: diluted_eps
    name: Diluted EPS
    unit_kind: currency_per_share
    statement: income_statement
    period_type: duration
    xbrl_concepts: [us-gaap:EarningsPerShareDiluted, ifrs-full:DilutedEarningsLossPerShare]
    derivation: net_income / diluted_shares
  - id: diluted_shares
    name: Weighted average diluted shares
    unit_kind: count
    statement: income_statement
    period_type: duration
    expected_sign: non_negative
    xbrl_concepts: [us-gaap:WeightedAverageNumberOfDilutedSharesOutstanding]
  - id: operating_cash_flow
    name: Cash flow from operations
    unit_kind: currency
    statement: cash_flow
    period_type: duration
    xbrl_concepts: [us-gaap:NetCashProvidedByUsedInOperatingActivities, ifrs-full:CashFlowsFromUsedInOperatingActivities]
  - id: investing_cash_flow
    name: Cash flow from investing
    unit_kind: currency
    statement: cash_flow
    period_type: duration
    xbrl_concepts: [us-gaap:NetCashProvidedByUsedInInvestingActivities, ifrs-full:CashFlowsFromUsedInInvestingActivities]
  - id: financing_cash_flow
    name: Cash flow from financing
    unit_kind: currency
    statement: cash_flow
    period_type: duration
    xbrl_concepts: [us-gaap:NetCashProvidedByUsedInFinancingActivities, ifrs-full:CashFlowsFromUsedInFinancingActivities]
  - id: fx_effect_on_cash
    name: Effect of exchange rates on cash
    unit_kind: currency
    statement: cash_flow
    period_type: duration
    xbrl_concepts: [us-gaap:EffectOfExchangeRateOnCashCashEquivalentsRestrictedCashAndRestrictedCashEquivalents, ifrs-full:EffectOfExchangeRateChangesOnCashAndCashEquivalents]
  - id: net_change_in_cash
    name: Net change in cash (incl. restricted cash)
    unit_kind: currency
    statement: cash_flow
    period_type: duration
    xbrl_concepts: [us-gaap:CashCashEquivalentsRestrictedCashAndRestrictedCashEquivalentsPeriodIncreaseDecreaseIncludingExchangeRateEffect, ifrs-full:IncreaseDecreaseInCashAndCashEquivalents]
  - id: cash_and_restricted_cash
    name: Cash, equivalents and restricted cash
    description: The balance the cash flow statement reconciles to under ASC 230 (post ASU 2016-18).
    unit_kind: currency
    statement: balance_sheet
    period_type: instant
    expected_sign: non_negative
    xbrl_concepts: [us-gaap:CashCashEquivalentsRestrictedCashAndRestrictedCashEquivalents, ifrs-full:CashAndCashEquivalents]
  - id: capital_expenditure
    name: Capital expenditure
    description: Reported as a positive payment amount.
    unit_kind: currency
    statement: cash_flow
    period_type: duration
    expected_sign: non_negative
    xbrl_concepts: [us-gaap:PaymentsToAcquirePropertyPlantAndEquipment, ifrs-full:PurchaseOfPropertyPlantAndEquipmentClassifiedAsInvestingActivities]
  - id: free_cash_flow
    name: Free cash flow
    unit_kind: currency
    statement: cash_flow
    period_type: duration
    derivation: operating_cash_flow - capital_expenditure
  - id: total_assets
    name: Total assets
    unit_kind: currency
    statement: balance_sheet
    period_type: instant
    expected_sign: non_negative
    xbrl_concepts: [us-gaap:Assets, ifrs-full:Assets]
  - id: total_liabilities
    name: Total liabilities
    unit_kind: currency
    statement: balance_sheet
    period_type: instant
    expected_sign: non_negative
    xbrl_concepts: [us-gaap:Liabilities, ifrs-full:Liabilities]
  - id: total_equity
    name: Total equity
    unit_kind: currency
    statement: balance_sheet
    period_type: instant
    xbrl_concepts: [us-gaap:StockholdersEquity, ifrs-full:Equity]
  - id: cash_and_equivalents
    name: Cash and equivalents
    unit_kind: currency
    statement: balance_sheet
    period_type: instant
    expected_sign: non_negative
    xbrl_concepts: [us-gaap:CashAndCashEquivalentsAtCarryingValue, ifrs-full:CashAndCashEquivalents]
  - id: total_debt
    name: Total debt
    unit_kind: currency
    statement: balance_sheet
    period_type: instant
    expected_sign: non_negative
    xbrl_concepts: [us-gaap:LongTermDebt]
    extraction_hint: Sum of current and non-current borrowings; tag coverage varies widely by filer.

# Accounting identities checked in the data-quality stage. Additive only: tolerances are derived from the
# reporting precision of the terms, which is defined for sums but not for ratios.
checks:
  - id: balance_sheet_identity
    description: Total assets equal total liabilities plus total equity.
    left: total_assets
    right: total_liabilities + total_equity
    severity: warning
    explanation_if_failed: >-
      Often legitimate: StockholdersEquity excludes non-controlling interests and temporary (mezzanine) equity,
      which some filers tag separately. Confirm against the balance sheet before treating as an extraction error.
  - id: cash_flow_statement_sum
    description: Operating, investing and financing cash flows plus FX effect equal the net change in cash.
    left: operating_cash_flow + investing_cash_flow + financing_cash_flow + fx_effect_on_cash
    right: net_change_in_cash
    optional_terms: [fx_effect_on_cash]
    severity: error
  - id: cash_roll_forward
    description: Opening cash plus the net change in cash equals closing cash.
    left: cash_and_restricted_cash__opening + net_change_in_cash
    right: cash_and_restricted_cash
    severity: error

# Historical analytics (annual). Ratios whose denominator is a balance use an explicit basis:
# `average` = mean of opening and closing balance, `opening` = prior year-end. Non-positive denominators
# and bases are not computed (a margin on negative revenue or a return on negative equity has no meaning).
analytics:
  - {id: revenue_growth, name: Revenue growth, category: growth, kind: growth, unit_kind: ratio, metric: revenue}
  - {id: operating_income_growth, name: Operating income growth, category: growth, kind: growth, unit_kind: ratio, metric: operating_income}
  - {id: net_income_growth, name: Net income growth, category: growth, kind: growth, unit_kind: ratio, metric: net_income}
  - {id: diluted_eps_growth, name: Diluted EPS growth, category: per_share, kind: growth, unit_kind: ratio, metric: diluted_eps}
  - {id: operating_cash_flow_growth, name: Operating cash flow growth, category: growth, kind: growth, unit_kind: ratio, metric: operating_cash_flow}
  - {id: gross_margin, name: Gross margin, category: profitability, kind: ratio, unit_kind: ratio, numerator: gross_profit, denominator: revenue}
  - {id: operating_margin, name: Operating margin, category: profitability, kind: ratio, unit_kind: ratio, numerator: operating_income, denominator: revenue}
  - {id: net_margin, name: Net margin, category: profitability, kind: ratio, unit_kind: ratio, numerator: net_income, denominator: revenue}
  - {id: free_cash_flow_margin, name: Free cash flow margin, category: profitability, kind: ratio, unit_kind: ratio, numerator: free_cash_flow, denominator: revenue}
  - {id: effective_tax_rate, name: Effective tax rate, category: profitability, kind: ratio, unit_kind: ratio, numerator: income_tax_expense, denominator: pre_tax_income}
  - {id: pretax_conversion, name: Pre-tax conversion of operating income, description: "Below-the-line items (interest, other income) as a conversion rate; the forecast bridge from operating to pre-tax income.", category: profitability, kind: ratio, unit_kind: ratio, numerator: pre_tax_income, denominator: operating_income}
  - {id: return_on_average_equity, name: Return on average equity, category: returns, kind: ratio, unit_kind: ratio, numerator: net_income, denominator: total_equity, denominator_basis: average}
  - {id: return_on_average_assets, name: Return on average assets, category: returns, kind: ratio, unit_kind: ratio, numerator: net_income, denominator: total_assets, denominator_basis: average}
  - id: nopat
    name: Net operating profit after tax
    description: Operating income taxed at the year's effective tax rate.
    category: returns
    kind: expression
    unit_kind: currency
    formula: operating_income * (1 - effective_tax_rate)
  - id: invested_capital
    name: Invested capital (debt + equity - cash)
    category: returns
    kind: expression
    unit_kind: currency
    formula: total_debt + total_equity - cash_and_equivalents
  - id: roic
    name: Return on average invested capital
    description: Sensitive to total_debt tag coverage; check the extraction report before relying on it.
    category: returns
    kind: ratio
    unit_kind: ratio
    numerator: nopat
    denominator: total_debt + total_equity - cash_and_equivalents
    denominator_basis: average
  - {id: asset_turnover, name: Asset turnover, category: efficiency, kind: ratio, unit_kind: multiple, numerator: revenue, denominator: total_assets, denominator_basis: average}
  - {id: capex_to_revenue, name: Capex / revenue, category: capital_intensity, kind: ratio, unit_kind: ratio, numerator: capital_expenditure, denominator: revenue}
  - {id: capex_to_operating_cash_flow, name: Capex / operating cash flow, category: capital_intensity, kind: ratio, unit_kind: ratio, numerator: capital_expenditure, denominator: operating_cash_flow}
  - {id: liabilities_to_equity, name: Liabilities / equity, category: leverage, kind: ratio, unit_kind: multiple, numerator: total_liabilities, denominator: total_equity}
  - {id: debt_to_equity, name: Debt / equity, category: leverage, kind: ratio, unit_kind: multiple, numerator: total_debt, denominator: total_equity}
  - {id: net_debt, name: Net debt, category: leverage, kind: expression, unit_kind: currency, formula: total_debt - cash_and_equivalents}
  - id: degree_of_operating_leverage
    name: Degree of operating leverage
    description: Operating income growth divided by revenue growth. Unstable when revenue growth is near zero; use the median.
    category: operating
    kind: elasticity
    unit_kind: multiple
    of: operating_income
    relative_to: revenue

charts:
  - {id: revenue, title: Revenue, kind: bar, series: [revenue], format: currency}
  - {id: growth, title: Year-on-year growth, kind: line, series: [revenue_growth, net_income_growth], format: percent}
  - {id: margins, title: Margins, kind: line, series: [gross_margin, operating_margin, net_margin], format: percent}
  - {id: returns, title: Returns on capital, kind: line, series: [return_on_average_equity, roic], format: percent}
  - {id: cash_flow, title: Cash flow, kind: bar, series: [operating_cash_flow, free_cash_flow], format: currency}
  - {id: leverage, title: Leverage, kind: line, series: [liabilities_to_equity, debt_to_equity], format: multiple}

drivers:
  - id: revenue_trajectory
    name: Revenue trajectory
    description: Trend/assumption-driven until a more specific framework supplies unit economics.
    affects: [revenue]
  - id: operating_leverage
    name: Operating margin
    affects: [operating_income]
    formula: revenue * operating_margin
  - id: pretax_bridge
    name: Below-the-line conversion
    description: Interest and other items between operating and pre-tax income, as a conversion rate.
    affects: [pre_tax_income]
    formula: operating_income * pretax_conversion
  - id: tax
    name: Effective tax rate
    affects: [income_tax_expense]
    formula: pre_tax_income * effective_tax_rate

# Metrics the forecast must produce even where no driver names them. The driver graph
# expands these transitively through driver formulas and framework derivations.
forecast_targets:
  - revenue
  - gross_profit
  - operating_income
  - pre_tax_income
  - income_tax_expense
  - net_income
  - diluted_eps
  - operating_cash_flow
  - free_cash_flow
  - total_equity

valuation:
  preferred: [dcf_fcff, ev_ebitda, pe, ev_revenue]

report_sections:
  - executive_summary
  - market_expectations
  - variant_perception
  - business_overview
  - historical_analysis
  - business_drivers
  - forecast
  - valuation
  - sensitivity
  - catalysts
  - risks
  - falsification
  - appendix
