name: banks
display_name: Commercial and universal banks
description: Deposit-funded balance-sheet lenders. Debt is operating raw material, not financing.
extends: generic

classification:
  sic_ranges: [[6020, 6029], [6035, 6036]]
  keywords: [bank, deposits, net interest income, loans]

# Industrial concepts that are meaningless or misleading for a bank.
remove_metrics: [cost_of_revenue, gross_profit, operating_income, capital_expenditure, free_cash_flow, total_debt]
remove_drivers: [operating_leverage, pretax_bridge]

metrics:
  - id: net_interest_income
    name: Net interest income
    unit_kind: currency
    statement: income_statement
    period_type: duration
    xbrl_concepts: [us-gaap:InterestIncomeExpenseNet]
  - id: noninterest_income
    name: Noninterest revenue
    unit_kind: currency
    statement: income_statement
    period_type: duration
    xbrl_concepts: [us-gaap:NoninterestIncome]
  - id: revenue
    name: Total net revenue
    description: Reported total if tagged; otherwise NII plus noninterest revenue.
    unit_kind: currency
    statement: income_statement
    period_type: duration
    expected_sign: non_negative
    xbrl_concepts: [us-gaap:Revenues]
    derivation: net_interest_income + noninterest_income
  - id: noninterest_expense
    name: Noninterest expense
    unit_kind: currency
    statement: income_statement
    period_type: duration
    expected_sign: non_negative
    xbrl_concepts: [us-gaap:NoninterestExpense]
  - id: provision_for_credit_losses
    name: Provision for credit losses
    unit_kind: currency
    statement: income_statement
    period_type: duration
    xbrl_concepts: [us-gaap:ProvisionForLoanLeaseAndOtherLosses, us-gaap:ProvisionForLoanAndLeaseLosses]
  - id: net_income_to_common
    name: Net income applicable to common
    unit_kind: currency
    statement: income_statement
    period_type: duration
    xbrl_concepts: [us-gaap:NetIncomeLossAvailableToCommonStockholdersBasic]
  - id: pre_tax_income
    name: Pre-tax income
    description: A bank has no operating-income line; pre-tax income is revenue less noninterest expense and provisions.
    unit_kind: currency
    statement: income_statement
    period_type: duration
    xbrl_concepts: [us-gaap:IncomeLossFromContinuingOperationsBeforeIncomeTaxesExtraordinaryItemsNoncontrollingInterest, ifrs-full:ProfitLossBeforeTax]
    derivation: revenue - noninterest_expense - provision_for_credit_losses
  - id: diluted_eps
    name: Diluted EPS
    description: Attributable to common shareholders, after preferred dividends.
    unit_kind: currency_per_share
    statement: income_statement
    period_type: duration
    xbrl_concepts: [us-gaap:EarningsPerShareDiluted, ifrs-full:DilutedEarningsLossPerShare]
    derivation: net_income_to_common / diluted_shares
  - id: loans
    name: Loans, net
    unit_kind: currency
    statement: balance_sheet
    period_type: instant
    expected_sign: non_negative
    xbrl_concepts: [us-gaap:LoansAndLeasesReceivableNetReportedAmount]
  - id: deposits
    name: Deposits
    unit_kind: currency
    statement: balance_sheet
    period_type: instant
    expected_sign: non_negative
    xbrl_concepts: [us-gaap:Deposits]
  - id: average_interest_earning_assets
    name: Average interest-earning assets
    unit_kind: currency
    statement: operating
    period_type: duration
    extraction_hint: Average balance sheet / net interest margin analysis table in the annual report.
  - id: tangible_common_equity
    name: Tangible common equity
    unit_kind: currency
    statement: balance_sheet
    period_type: instant
    extraction_hint: Non-GAAP reconciliation in earnings supplement; definitions vary by bank.
  - id: cet1_ratio
    name: CET1 ratio
    unit_kind: ratio
    statement: regulatory
    period_type: instant
    extraction_hint: Regulatory capital section; state Standardized vs Advanced approach.
  - id: risk_weighted_assets
    name: Risk-weighted assets
    unit_kind: currency
    statement: regulatory
    period_type: instant
    expected_sign: non_negative
    extraction_hint: Regulatory capital section; same approach as CET1.
  - id: net_interest_margin
    name: Net interest margin
    unit_kind: ratio
    statement: operating
    period_type: duration
    derivation: net_interest_income / average_interest_earning_assets

remove_analytics: [operating_income_growth, gross_margin, operating_margin, free_cash_flow_margin, nopat, invested_capital,
                   roic, asset_turnover, capex_to_revenue, capex_to_operating_cash_flow, debt_to_equity, net_debt,
                   degree_of_operating_leverage, pretax_conversion]
# Industrial forecast targets that do not exist for a bank.
remove_forecast_targets: [gross_profit, operating_income, free_cash_flow]
remove_charts: [margins, returns, cash_flow, leverage]

analytics:
  - {id: net_interest_income_growth, name: Net interest income growth, category: growth, kind: growth, unit_kind: ratio, metric: net_interest_income}
  - {id: loan_growth, name: Loan growth, category: growth, kind: growth, unit_kind: ratio, metric: loans}
  - {id: deposit_growth, name: Deposit growth, category: growth, kind: growth, unit_kind: ratio, metric: deposits}
  - {id: noninterest_income_share, name: Noninterest revenue share, category: operating, kind: ratio, unit_kind: ratio, numerator: noninterest_income, denominator: revenue}
  - {id: efficiency_ratio, name: Efficiency ratio, category: efficiency, kind: ratio, unit_kind: ratio, numerator: noninterest_expense, denominator: revenue}
  - {id: pre_provision_profit, name: Pre-provision profit, category: profitability, kind: expression, unit_kind: currency, formula: revenue - noninterest_expense}
  - {id: credit_loss_rate, name: Provision / average loans, category: credit, kind: ratio, unit_kind: ratio, numerator: provision_for_credit_losses, denominator: loans, denominator_basis: average}
  - {id: loan_to_deposit, name: Loans / deposits, category: liquidity, kind: ratio, unit_kind: ratio, numerator: loans, denominator: deposits}
  - {id: equity_to_assets, name: Equity / assets, category: capital, kind: ratio, unit_kind: ratio, numerator: total_equity, denominator: total_assets}
  - {id: common_attribution, name: Earnings attributable to common, description: "Net income to common / net income; preferred dividends and minority interests as a conversion rate.", category: profitability, kind: ratio, unit_kind: ratio, numerator: net_income_to_common, denominator: net_income}
  - {id: rotce, name: Return on average tangible common equity, category: returns, kind: ratio, unit_kind: ratio, numerator: net_income_to_common, denominator: tangible_common_equity, denominator_basis: average}

charts:
  - {id: bank_returns, title: Returns, kind: line, series: [rotce, return_on_average_equity, return_on_average_assets], format: percent}
  - {id: bank_revenue_mix, title: Revenue mix, kind: bar, series: [net_interest_income, noninterest_income], format: currency}
  - {id: bank_credit, title: Credit costs, kind: line, series: [credit_loss_rate], format: percent}
  - {id: bank_balance_sheet, title: Balance sheet ratios, kind: line, series: [loan_to_deposit, equity_to_assets], format: percent}
  - {id: bank_efficiency, title: Efficiency ratio, kind: line, series: [efficiency_ratio], format: percent}

drivers:
  - id: balance_sheet_growth
    name: Loan and deposit growth
    affects: [loans, deposits]
  - id: net_interest_income_engine
    name: Earning assets x margin
    affects: [net_interest_income]
    formula: average_interest_earning_assets * net_interest_margin
  - id: credit_cost
    name: Credit costs
    affects: [provision_for_credit_losses]
    formula: loans * credit_loss_rate
  - id: preferred_attribution
    name: Attribution to common
    description: Preferred dividends and minority interests between net income and income to common.
    affects: [net_income_to_common]
    formula: net_income * common_attribution
  - id: capital_constraint
    name: Capital requirement
    description: CET1 x RWA bounds distributable capital.
    affects: [cet1_ratio]

forecast_targets:
  - net_interest_income
  - noninterest_income
  - noninterest_expense
  - provision_for_credit_losses
  - revenue
  - pre_tax_income
  - income_tax_expense
  - net_income
  - net_income_to_common
  - diluted_eps
  - loans
  - deposits
  - total_equity
  - tangible_common_equity
  - cet1_ratio

valuation:
  preferred: [residual_income, ptbv, pb, pe, dividend_discount]
  excluded:
    dcf_fcff: Debt and deposits are operating inputs for a bank; free cash flow to the firm is not meaningful.
    ev_ebitda: Enterprise value and EBITDA are undefined when interest is the core revenue and cost line.
    ev_revenue: Enterprise value is not meaningful for a deposit-funded balance sheet.

report_sections:
  - executive_summary
  - market_expectations
  - variant_perception
  - business_overview
  - historical_analysis
  - capital_and_credit
  - business_drivers
  - forecast
  - valuation
  - sensitivity
  - catalysts
  - risks
  - falsification
  - appendix
